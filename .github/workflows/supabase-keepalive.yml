name: Supabase Health Check

on:
  schedule:
    # Run every 2 days at midnight UTC
    - cron: "0 0 */2 * *"
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (Bypass Edge Cache)
        run: |
          TIMESTAMP=$(date +%s)
          echo "Pinging Supabase at timestamp $TIMESTAMP..."
          RESPONSE=$(curl -sS --fail-with-body -w "\nHTTP_STATUS:%{http_code}\n" \
            -X GET "https://hkxhfonfgqgdbkpwbtva.supabase.co/rest/v1/projects?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache")
          echo "$RESPONSE"
