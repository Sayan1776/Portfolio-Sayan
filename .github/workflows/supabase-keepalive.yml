name: Supabase Health Check

# Run every 3 days at midnight
on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -X GET "https://qxgimcqpzfscflsbenyh.supabase.co/rest/v1/projects?select=title&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
